[package]
name = "test_python_rust"
version = "0.1.0"
edition = "2021"


[dependencies]
anyhow = "1.0.71"
bincode = "1.3.3"
bitflags = "2.2.1"
derive_more = { version = "0.99.17", default-features = false, features = [
    "add",
    "add_assign",
] }
atomic-queue = "2.2.0"
lazy_static = "1.5.0"
endiannezz = "0.6.5"
enum-kinds = "0.5.1"
enum_index = "0.2.0"
enum_index_derive = "0.2.0"
glob = "0.3.1"
itertools = "0.10.5"
log = "0.4.17"
parking_lot = "0.12.1"
rune = "0.12.3"
serde = { version = "1.0.162", features = ["derive", "rc"] }
serde_yaml = "0.8.26"
variant_count = "1.1.0"
zstd = "0.12.3"
pyo3 = {version = "0.22.3", features = ["auto-initialize"]}
hex = "0.4"

[dev-dependencies]
fastrand = "1.9.0"
insta = "1.29.0"
pretty_assertions = "1.3.0"
tempfile = "3.5.0"

